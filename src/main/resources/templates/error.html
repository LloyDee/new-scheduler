<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{shared/layout :: page('Page unavailable', 'more', ~{::section})}"
>
  <body>
    <section>
      <div class="card empty">
        <p class="eyebrow" th:text="${status}"></p>
        <h1>This page is unavailable.</h1>
        <p>
          The item may have been removed, the link may be invalid, or the
          request could not be completed.
        </p>
        <a class="button" th:href="@{/}">Return home</a>
      </div>
    </section>
  </body>
</html>
