<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{shared/layout :: page('Departments', 'departments', ~{::section})}"
>
  <body>
    <section>
      <div class="page-heading">
        <a th:if="${canManage}" class="button" th:href="${base + '/departments?create=true#editor'}"
          >+ Add department</a
          >
      </div>
      <div class="workspace" th:classappend="${!showEditor ? 'list-only' : ''}">
        <div class="stack">
          <p class="list-count" th:text="${listPage.totalElements + ' departments'}"></p>
          <div class="card empty" th:if="${departments.isEmpty()}">
            <h2>Create your Department here.</h2>
            <p>
              Add your first department, then create its shifts in the schedule.
            </p>
          </div>
          <article class="card department-card" th:each="d : ${departments}" th:with="details=${departmentDetails[d.id]}">
            <div class="department-card-header">
              <p class="eyebrow">DEPARTMENT</p>
              <span class="department-icon-line department-volunteer-count">
                <svg aria-hidden="true"><use href="#people" /></svg>
                <span class="sr-only">Volunteers: </span><span th:text="${details['volunteerCount']}"></span>
              </span>
            </div>
            <h2 th:text="${d.name}"></h2>
            <p
              class="preserve muted"
              th:if="${!#strings.isEmpty(d.description)}"
              th:text="${d.description}"
            ></p>
            <div class="department-leadership">
              <strong>Overseer:</strong>
              <p class="department-icon-line" th:each="name : ${details['OVERSEER']}"><svg aria-hidden="true"><use href="#people" /></svg><span th:classappend="${ownVolunteerIds.contains(name.id) ? 'current-user-name' : ''}" th:text="${name.name}"></span></p>
              <p class="muted" th:if="${#lists.isEmpty(details['OVERSEER'])}">Not assigned</p>
            </div>
            <div class="department-leadership">
              <strong>Assistant Overseers:</strong>
              <p class="department-icon-line" th:each="name : ${details['ASSISTANT_OVERSEER']}"><svg aria-hidden="true"><use href="#people" /></svg><span th:classappend="${ownVolunteerIds.contains(name.id) ? 'current-user-name' : ''}" th:text="${name.name}"></span></p>
              <p class="muted" th:if="${#lists.isEmpty(details['ASSISTANT_OVERSEER'])}">Not assigned</p>
            </div>
            <div class="card-actions">
              <a th:if="${canManage}"
                th:href="@{${base + '/departments'}(edit=${d.id})} + '#editor'"
                >Edit</a
              >
              <form th:if="${canManage}"
                method="post"
                th:action="@{${base + '/departments/' + d.id + '/delete'}}"
                data-confirm="Delete this department and all its shifts and assignments?"
              >
                <button class="text-button danger">Delete</button>
              </form>
            </div>
            <details class="department-coverage" th:open="${selectedDepartment != null and selectedDepartment.id == d.id}">
              <summary>View coverage</summary>
              <div th:replace="~{shared/fragments :: shifts(${departmentSchedules[d.id]}, false)}"></div>
            </details>
          </article>
          <nav th:replace="~{shared/fragments :: pagination(${listPage}, @{${base + '/departments'}(page=${listPage.number - 1})}, @{${base + '/departments'}(page=${listPage.number + 1})})}"></nav>
        </div>
        <aside class="card editor" id="editor" th:if="${showEditor}">
          <p class="eyebrow">TEAM DETAILS</p>
          <h2
            th:text="${editId == null ? 'Add a department' : 'Edit department'}"
          ></h2>
          <form
            class="form-stack"
            method="post"
            th:action="@{${base + '/departments/save'}}"
          >
            <input
              th:if="${editId != null}"
              type="hidden"
              name="id"
              th:value="${editId}"
            /><label
              >Department name
              <input
                name="name"
                required
                maxlength="160"
                th:value="${draft['name']}"
                placeholder="e.g. Attendants" /></label
            ><label
              >Description <span class="optional">optional</span
              ><textarea
                name="description"
                maxlength="2000"
                rows="4"
                th:text="${draft['description']}"
              ></textarea></label
            ><button
              th:text="${editId == null ? 'Add department' : 'Save changes'}"
            ></button
            ><a th:href="${base + '/departments'}"
              >Cancel</a
            >
          </form>
        </aside>
      </div>
    </section>
  </body>
</html>
